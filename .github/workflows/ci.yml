name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # `ruff-action` reads the pinned version straight out of pyproject.toml, so
      # `pip install -e ".[dev]"` locally and CI run the identical linter. An
      # unpinned linter silently upgrades and fails the build on rules that did
      # not exist when the change was written -- RUF043 is how that bit us once.
      - name: Ruff lint
        uses: astral-sh/ruff-action@v3
        with:
          version-file: pyproject.toml
          args: check --output-format=github
      - name: Ruff format check
        uses: astral-sh/ruff-action@v3
        with:
          version-file: pyproject.toml
          args: format --check

  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          # setup-uv's default glob looks for uv.lock / requirements*.txt, neither
          # of which this project has, so it warns that the cache can never be
          # invalidated. Point the cache key at pyproject.toml instead.
          cache-dependency-glob: "pyproject.toml"
      - name: Install
        run: uv sync --extra dev --python ${{ matrix.python-version }}
      - name: Unit tests
        run: uv run pytest -q
      - name: Dataset self-check
        run: uv run structbench validate --quiet

  demo-run:
    name: offline demo run
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - run: uv sync --extra dev
      - name: Run the whole suite against the offline simulator
        run: |
          uv run structbench run \
            -m mock:perfect,mock:good,mock:flaky,mock:escape_phobic,mock:typing_weak,mock:tool_butcher \
            --concurrency 16 \
            --quiet \
            -o ci-results \
            --markdown ci-results/leaderboard.md
      - name: Verify the harness is self-consistent
        run: uv run python scripts/ci_gate.py ci-results
      - name: Upload the report
        uses: actions/upload-artifact@v6
        with:
          name: structbench-report
          path: ci-results/
          if-no-files-found: error
