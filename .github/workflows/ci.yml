name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      # Ruff is installed from the pinned `dev` extra rather than via a
      # dedicated action, for two reasons: the version then comes from exactly one
      # place (so `pip install -e ".[dev]"` locally and CI run the identical
      # linter), and `astral-sh/ruff-action` still ships on node20, which GitHub
      # force-migrates to node24 and reports as deprecated on every single job.
      - name: Install the pinned dev toolchain
        run: uv sync --extra dev
      - name: Ruff lint
        run: uv run ruff check --output-format=github .
      - name: Ruff format check
        run: uv run ruff format --check .

  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          # setup-uv's default glob looks for uv.lock / requirements*.txt, neither
          # of which this project has, so it warns that the cache can never be
          # invalidated. Point the cache key at pyproject.toml instead.
          cache-dependency-glob: "pyproject.toml"
      - name: Install
        run: uv sync --extra dev --python ${{ matrix.python-version }}
      - name: Unit tests
        run: uv run pytest -q
      - name: Dataset self-check
        run: uv run structbench validate --quiet
      - name: READMEs stay in sync
        run: uv run python scripts/check_readmes.py
      - name: Dependencies still resolve
        run: uv run python scripts/check_deps.py

  demo-run:
    name: offline demo run
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - run: uv sync --extra dev
      - name: Run the whole suite against the offline simulator
        run: |
          uv run structbench run \
            -m mock:perfect,mock:good,mock:flaky,mock:escape_phobic,mock:typing_weak,mock:tool_butcher \
            --concurrency 16 \
            --quiet \
            -o ci-results \
            --markdown ci-results/leaderboard.md
      - name: Verify the harness is self-consistent
        run: uv run python scripts/ci_gate.py ci-results
      - name: Upload the report
        uses: actions/upload-artifact@v6
        with:
          name: structbench-report
          path: ci-results/
          if-no-files-found: error
