name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep CI output readable and deterministic.
  PYTHONIOENCODING: utf-8
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Ruff lint
        run: uvx ruff check --output-format=github .
      - name: Ruff format check
        run: uvx ruff format --check .

  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv sync --extra dev --python ${{ matrix.python-version }}
      - name: Unit tests
        run: uv run pytest -q
      - name: Dataset self-check
        run: uv run structbench validate --quiet

  demo-run:
    name: offline demo run
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - name: Run the whole suite against the offline simulator
        run: |
          uv run structbench run \
            -m mock:perfect,mock:good,mock:flaky,mock:escape_phobic,mock:typing_weak,mock:tool_butcher \
            --concurrency 16 \
            --quiet \
            -o ci-results \
            --markdown ci-results/leaderboard.md
      - name: The perfect persona must score 100% Pass@1
        run: |
          uv run python - <<'PY'
          import json, pathlib, sys
          archive = max(pathlib.Path("ci-results").glob("run-*.json"))
          result = json.loads(archive.read_text(encoding="utf-8"))
          score = next(m for m in result["models"] if m["model"] == "mock/perfect")
          print("mock/perfect Pass@1:", score["pass_at_1_rate"])
          sys.exit(0 if score["pass_at_1_rate"] == 1.0 else 1)
          PY
      - name: Upload the report
        uses: actions/upload-artifact@v4
        with:
          name: structbench-report
          path: ci-results/
          if-no-files-found: error
