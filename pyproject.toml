[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "structbench"
version = "0.1.0"
description = "Stress-testing LLMs on extreme JSON schemas, nested tool calls, and self-healing recovery."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "StructBench Contributors" }]
keywords = [
    "llm",
    "benchmark",
    "evaluation",
    "structured-output",
    "json-schema",
    "tool-calling",
    "function-calling",
    "agent",
    "self-healing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
    "jinja2>=3.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    # Capped at the major version this suite is actually verified against.
    # `uv sync` resolves fresh on every CI run, so an unbounded pytest would
    # eventually pull in a release with different collection semantics and break
    # a build that has nothing to do with the change under review. Widen this
    # only after running the suite on the newer major.
    "pytest>=8.0,<9",
    # Only needed if you add `async def` tests of your own: the shipped suite is
    # deliberately plugin-free (it drives asyncio.run() from sync tests).
    "pytest-asyncio>=0.23",
    # Pinned exactly, and mirrored by the ruff pin in .github/workflows/ci.yml.
    # An unpinned linter means CI can start failing on rules that did not exist
    # when the code was written, which is confusing and wastes a CI cycle.
    "ruff==0.14.14",
]

[project.scripts]
structbench = "structbench.cli:main"

[project.urls]
Homepage = "https://github.com/dshjfdsh/StructBench"
Repository = "https://github.com/dshjfdsh/StructBench"
Issues = "https://github.com/dshjfdsh/StructBench/issues"
Changelog = "https://github.com/dshjfdsh/StructBench/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/structbench"]

# Ship the repo-level `datasets/` directory inside the wheel so that
# `pip install structbench` users get the bundled benchmark suite too.
[tool.hatch.build.targets.wheel.force-include]
"datasets" = "structbench/datasets"

[tool.hatch.build.targets.sdist]
include = ["src", "datasets", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = [".tmp", ".uv-python", ".uv-cache", ".pytest-work", ".pytest-tmp", "results"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",    # line length is handled by the formatter's judgement, not a hard rule
    "B008",    # Typer's API *requires* function calls in argument defaults
    "UP007",   # dynamic unions (Union[tuple(types)]) cannot use PEP 604 syntax
    "RUF001",  # ambiguous unicode: the reports are intentionally bilingual
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
# The suite is deliberately plugin-free: every test is a plain sync function that
# drives `asyncio.run()` internally, so `pytest` alone runs it. That is also why
# no `asyncio_mode` is set here -- pytest-asyncio is an optional extra, and
# declaring the option without the plugin installed only produces a warning.
# If you add `async def` tests, install the extra and set `asyncio_mode = "auto"`.
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]
