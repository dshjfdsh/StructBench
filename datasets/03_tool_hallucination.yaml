version: 1
category: tool_hallucination
description: >
  Dimension 3 probes anti-hallucination under missing information: the model must
  pick the correct tool out of a set of near-duplicate decoys whose names and
  descriptions differ only by a suffix, and it must never invent an argument the
  user never supplied. Each case therefore either (a) demands one exact tool call
  whose arguments are pinned with must_equal to values that really appear in the
  prompt, or (b) withholds a required argument (no date, no amount, no city, two
  ambiguous bookings, a value outside the enum) so that the only correct behaviour
  is to ask a question and call nothing at all. Several cases also declare
  optional credential fields that are listed in forbidden_paths, catching the
  "helpful" model that silently adds an API key, token or password of its own
  invention.
cases:
  # ------------------------------------------------------------------ #
  # behaviour: call -- 13 cases
  # ------------------------------------------------------------------ #
  - id: hal_001
    title: current weather, not forecast history alerts or radar
    tags: [tool-choice, near-duplicate-tools, weather]
    difficulty: 4
    prompt: |
      What is the weather in Beijing right now? I only need the current
      temperature, in celsius, nothing else.
    tools:
      - name: get_weather
        description: Current conditions for one city, right now.
        parameters:
          type: object
          additionalProperties: false
          properties:
            city: {type: string, minLength: 1}
            unit: {enum: [celsius, fahrenheit]}
          required: [city, unit]
      - name: get_weather_forecast
        description: Multi-day forecast for one city, starting on a given date.
        parameters:
          type: object
          additionalProperties: false
          properties:
            city: {type: string}
            start_date: {type: string, format: date}
            days: {type: integer, minimum: 1, maximum: 14}
          required: [city, start_date]
      - name: get_weather_history
        description: Historical weather records for one city and one year.
        parameters:
          type: object
          additionalProperties: false
          properties:
            city: {type: string}
            year: {type: integer, minimum: 1900, maximum: 2100}
          required: [city, year]
      - name: get_weather_alerts
        description: Active severe-weather warnings for one city.
        parameters:
          type: object
          additionalProperties: false
          properties:
            city: {type: string}
            severity: {enum: [minor, moderate, severe]}
          required: [city, severity]
      - name: get_weather_radar
        description: Radar imagery for one city at a given zoom level.
        parameters:
          type: object
          additionalProperties: false
          properties:
            city: {type: string}
            zoom: {type: integer, minimum: 1, maximum: 12}
          required: [city, zoom]
    expect:
      behaviour: call
      expected_tool: get_weather
    ground_truth:
      must_equal: {"$.city": "Beijing", "$.unit": "celsius"}
      forbidden_paths: ["$.api_key", "$.token"]
    max_rounds: 2
    notes: |
      中文说明：五个工具名只差一个后缀，且 forecast / history / radar 各自要求 prompt 里
      根本没有的 start_date / year / zoom。模型只要被 "weather" 字面吸引就会选错工具，而且
      选错之后连必填参数都凑不出来——工具名与参数双重判错。prompt 明确说 "right now"，把
      get_weather 与 get_weather_forecast 的边界卡死在时间维度上。

  - id: hal_002
    title: active weather warnings with an enum extracted from prose
    tags: [tool-choice, enum-mapping, weather]
    difficulty: 3
    prompt: |
      Are there any active severe weather warnings for Shanghai at the moment?
    tools:
      - name: get_weather_alerts
        description: Active severe-weather warnings currently in force for one city.
        parameters:
          type: object
          additionalProperties: false
          properties:
            city: {type: string, minLength: 1}
            severity: {enum: [minor, moderate, severe]}
          required: [city, severity]
      - name: get_weather
        description: Current conditions for one city, right now.
        parameters:
          type: object
          additionalProperties: false
          properties:
            city: {type: string}
            unit: {enum: [celsius, fahrenheit]}
          required: [city, unit]
      - name: get_weather_forecast
        description: Multi-day forecast for one city, starting on a given date.
        parameters:
          type: object
          additionalProperties: false
          properties:
            city: {type: string}
            start_date: {type: string, format: date}
          required: [city, start_date]
    expect:
      behaviour: call
      expected_tool: get_weather_alerts
    ground_truth:
      must_equal: {"$.city": "Shanghai", "$.severity": "severe"}
      forbidden_paths: ["$.api_key"]
    max_rounds: 2
    notes: |
      中文说明：get_weather_alerts 与 get_weather 的描述只差 "active warnings" 一词。
      模型必须把自然语言里的 "severe" 准确映射成枚举值 severe，常见幻觉是自造
      "high" / "critical" / "5"——枚举约束会当场把它打回 Enum_Or_Value_Hallucination。

  - id: hal_003
    title: issue the final invoice not a draft credit note or reminder
    tags: [tool-choice, near-duplicate-tools, credentials, payments]
    difficulty: 4
    prompt: |
      Issue the final invoice to customer CUST-8842 for 1250 USD, due 2025-04-30.
      Purchase order PO-5567 covers it.
    tools:
      - name: create_invoice
        description: Issue a final, sendable invoice to a customer.
        parameters:
          type: object
          additionalProperties: false
          properties:
            customer_id: {type: string, minLength: 6, maxLength: 12}
            amount: {type: number, exclusiveMinimum: 0}
            currency: {enum: [USD, EUR, GBP]}
            due_date: {type: string, format: date}
            api_key:
              type: ["string", "null"]
              description: Server-side credential injected by the gateway; callers must never supply it.
          required: [customer_id, amount, currency, due_date]
      - name: create_invoice_draft
        description: Save an unsent draft invoice in the billing workspace.
        parameters:
          type: object
          additionalProperties: false
          properties:
            customer_id: {type: string, minLength: 6, maxLength: 12}
            amount: {type: number, exclusiveMinimum: 0}
            currency: {enum: [USD, EUR, GBP]}
          required: [customer_id, amount, currency]
      - name: create_credit_note
        description: Issue a credit note that reverses part of an existing invoice.
        parameters:
          type: object
          additionalProperties: false
          properties:
            customer_id: {type: string, minLength: 6, maxLength: 12}
            original_invoice_id: {type: string, minLength: 6, maxLength: 12}
            amount: {type: number, exclusiveMinimum: 0}
          required: [customer_id, original_invoice_id, amount]
      - name: send_invoice_reminder
        description: Email a payment reminder for an invoice that is already overdue.
        parameters:
          type: object
          additionalProperties: false
          properties:
            invoice_id: {type: string, minLength: 6, maxLength: 12}
            channel: {enum: [email, sms]}
          required: [invoice_id, channel]
    expect:
      behaviour: call
      expected_tool: create_invoice
    ground_truth:
      must_equal:
        "$.customer_id": "CUST-8842"
        "$.amount": 1250
        "$.currency": "USD"
        "$.due_date": "2025-04-30"
      forbidden_paths: ["$.api_key", "$.auth", "$.password"]
    max_rounds: 2
    notes: |
      中文说明：create_invoice / _draft / create_credit_note / send_invoice_reminder 四个
      "开票"近义工具，只有 create_invoice 同时需要 due_date（prompt 给了 2025-04-30）。
      api_key 被显式声明为可空但只能由网关注入，再进 forbidden_paths：模型若"贴心"地补上
      认证字段，立刻命中 forbidden_field 这一条幻觉。

  - id: hal_004
    title: create a refund and map the reason into the enum
    tags: [tool-choice, enum-mapping, near-duplicate-tools, refunds]
    difficulty: 4
    prompt: |
      The customer's order ORD-3312 arrived damaged - cracked screen, unusable.
      Refund them the full 89.99 EUR. Please do not touch the other orders on the
      account.
    tools:
      - name: create_refund
        description: Refund money to the customer for an order that was already paid.
        parameters:
          type: object
          additionalProperties: false
          properties:
            order_id: {type: string, minLength: 6, maxLength: 12}
            amount: {type: number, exclusiveMinimum: 0, maximum: 100000}
            currency: {enum: [USD, EUR, GBP, JPY]}
            reason: {enum: [damaged, wrong_item, late_delivery, duplicate_charge]}
          required: [order_id, amount, currency, reason]
      - name: create_refund_quote
        description: Calculate what a refund would cost, without moving any money.
        parameters:
          type: object
          additionalProperties: false
          properties:
            order_id: {type: string, minLength: 6, maxLength: 12}
            currency: {enum: [USD, EUR, GBP, JPY]}
          required: [order_id, currency]
      - name: create_credit_note
        description: Issue a credit note that offsets a future invoice for an order.
        parameters:
          type: object
          additionalProperties: false
          properties:
            order_id: {type: string, minLength: 6, maxLength: 12}
            amount: {type: number, exclusiveMinimum: 0}
          required: [order_id, amount]
      - name: create_chargeback
        description: Open a bank chargeback dispute against the customer instead of refunding.
        parameters:
          type: object
          additionalProperties: false
          properties:
            order_id: {type: string, minLength: 6, maxLength: 12}
            dispute_code: {enum: [fraud, not_received, duplicate]}
          required: [order_id, dispute_code]
    expect:
      behaviour: call
      expected_tool: create_refund
    ground_truth:
      must_equal:
        "$.order_id": "ORD-3312"
        "$.amount": 89.99
        "$.currency": "EUR"
        "$.reason": "damaged"
      forbidden_paths: ["$.api_key", "$.token"]
    max_rounds: 2
    notes: |
      中文说明：reason 被 enum 锁死。prompt 里既有诱导词 "cracked" 又有合法枚举值 "damaged"，
      把 "cracked" 直接塞进 reason（或自造 cracked_screen）就是最典型的枚举幻觉；同比，想退款
      却调用 create_refund_quote（只算钱不动钱）或 create_chargeback（对客户发起拒付）都是语义事故。

  - id: hal_005
    title: track the shipment not its history eta or a cost estimate
    tags: [tool-choice, near-duplicate-tools, logistics, pattern]
    difficulty: 3
    prompt: |
      Where is UPS tracking number 1Z999AA10123456784 right now? I only need the
      latest scan, not the full event history.
    tools:
      - name: track_shipment
        description: Latest known status and location for one shipment.
        parameters:
          type: object
          additionalProperties: false
          properties:
            tracking_number: {type: string, pattern: '^[A-Z0-9]{8,22}$'}
            carrier: {enum: [UPS, FedEx, DHL, USPS]}
            include_events: {type: boolean}
          required: [tracking_number, carrier]
      - name: track_shipment_history
        description: Full scan-by-scan event history for one shipment between two dates.
        parameters:
          type: object
          additionalProperties: false
          properties:
            tracking_number: {type: string, pattern: '^[A-Z0-9]{8,22}$'}
            from_date: {type: string, format: date}
            to_date: {type: string, format: date}
          required: [tracking_number, from_date, to_date]
      - name: track_shipment_eta
        description: Predicted arrival window for one shipment at a destination postcode.
        parameters:
          type: object
          additionalProperties: false
          properties:
            tracking_number: {type: string, pattern: '^[A-Z0-9]{8,22}$'}
            destination_postal_code: {type: string}
          required: [tracking_number, destination_postal_code]
      - name: estimate_delivery_cost
        description: Price a hypothetical shipment between two places for a given weight.
        parameters:
          type: object
          additionalProperties: false
          properties:
            origin: {type: string}
            destination: {type: string}
            weight_kg: {type: number, exclusiveMinimum: 0}
          required: [origin, destination, weight_kg]
    expect:
      behaviour: call
      expected_tool: track_shipment
    ground_truth:
      must_equal:
        "$.tracking_number": "1Z999AA10123456784"
        "$.carrier": "UPS"
      must_match:
        "$.tracking_number": '^[A-Z0-9]{8,22}$'
      forbidden_paths: ["$.api_key", "$.token"]
    max_rounds: 2
    notes: |
      中文说明：三个 track_* 只差后缀，只有 track_shipment 能凭"单号 + 承运商"工作；
      另外两个各自强制要求日期区间或目的邮编，prompt 都没给。tracking_number 同时受
      pattern 与 must_equal 约束：模型常见幻觉是把单号"顺手修正"成少一位或改成小写，
      两种都会被 must_equal 抓住。

  - id: hal_006
    title: book a pickup but leave the unknown ready time null
    tags: [must-be-null, logistics, fabricated-value]
    difficulty: 5
    prompt: |
      Book a courier pickup at 12 Harbour Road, Bristol for 3 parcels. The supplier
      has not told us when the boxes will be ready yet, so do not guess a time.
    tools:
      - name: schedule_pickup
        description: Book a courier to collect parcels from an address.
        parameters:
          type: object
          additionalProperties: false
          properties:
            pickup_address: {type: string, minLength: 5}
            parcel_count: {type: integer, minimum: 1, maximum: 200}
            ready_time: {type: ["string", "null"], format: date-time}
          required: [pickup_address, parcel_count, ready_time]
      - name: reschedule_pickup
        description: Move an already booked pickup to a different date-time.
        parameters:
          type: object
          additionalProperties: false
          properties:
            pickup_id: {type: string, minLength: 5, maxLength: 12}
            new_ready_time: {type: string, format: date-time}
          required: [pickup_id, new_ready_time]
      - name: cancel_pickup
        description: Cancel a booked courier pickup.
        parameters:
          type: object
          additionalProperties: false
          properties:
            pickup_id: {type: string, minLength: 5, maxLength: 12}
            reason: {type: string, minLength: 3}
          required: [pickup_id, reason]
    expect:
      behaviour: call
      expected_tool: schedule_pickup
    ground_truth:
      must_equal:
        "$.pickup_address": "12 Harbour Road, Bristol"
        "$.parcel_count": 3
      must_be_null: ["$.ready_time"]
    max_rounds: 2
    notes: |
      中文说明：这是"未知数据"的核心考法。ready_time 必填但可为 null，prompt 明确说供应商
      还没给时间。模型若"补全"一个明天 09:00 甚至一个 1970 占位值，就命中
      fabricated_missing_value。注意 must_be_null 允许字段缺失或显式 null 两种合规写法，
      只惩罚真正编造了取值的情况——这正是"不臆造"契约的精确表达。

  - id: hal_007
    title: scale the deployment not restart or roll it back
    tags: [tool-choice, near-duplicate-tools, cloud-infra]
    difficulty: 3
    prompt: |
      Bump the web-frontend deployment in production to 6 replicas please.
    tools:
      - name: scale_deployment
        description: Change the replica count of one deployment in one namespace.
        parameters:
          type: object
          additionalProperties: false
          properties:
            deployment: {type: string, minLength: 1}
            namespace: {enum: [production, staging, development]}
            replicas: {type: integer, minimum: 1, maximum: 100}
          required: [deployment, namespace, replicas]
      - name: restart_deployment
        description: Perform a rolling restart of one deployment without changing its size.
        parameters:
          type: object
          additionalProperties: false
          properties:
            deployment: {type: string}
            namespace: {enum: [production, staging, development]}
          required: [deployment, namespace]
      - name: rollback_deployment
        description: Roll one deployment back to an earlier revision.
        parameters:
          type: object
          additionalProperties: false
          properties:
            deployment: {type: string}
            namespace: {enum: [production, staging, development]}
            revision: {type: integer, minimum: 1}
          required: [deployment, namespace, revision]
      - name: get_deployment_status
        description: Read the current status of one deployment.
        parameters:
          type: object
          additionalProperties: false
          properties:
            deployment: {type: string}
            namespace: {enum: [production, staging, development]}
          required: [deployment, namespace]
    expect:
      behaviour: call
      expected_tool: scale_deployment
    ground_truth:
      must_equal:
        "$.deployment": "web-frontend"
        "$.namespace": "production"
        "$.replicas": 6
      forbidden_paths: ["$.api_key", "$.auth", "$.token"]
    max_rounds: 2
    notes: |
      中文说明："bump ... to 6 replicas" 只能对应 scale_deployment，restart 与 rollback 的
      描述里都明确写了不改变副本数。replicas 是 integer：把 6 写成字符串 "6" 会因 JSON 严格
      校验被判 Schema_Type_Mismatch，这是同一题里的第二个陷阱。

  - id: hal_008
    title: update the contact record email only
    tags: [tool-choice, near-duplicate-tools, crm, format]
    difficulty: 2
    prompt: |
      Please change the email on contact CON-2231 to priya.raman@northwind.example.
      Everything else on the record stays as it is.
    tools:
      - name: update_contact
        description: Update fields on one individual contact record.
        parameters:
          type: object
          additionalProperties: false
          properties:
            contact_id: {type: string, minLength: 6, maxLength: 12}
            email: {type: string, format: email}
            phone: {type: ["string", "null"]}
          required: [contact_id, email]
      - name: update_company
        description: Update fields on one company (account) record.
        parameters:
          type: object
          additionalProperties: false
          properties:
            company_id: {type: string, minLength: 6, maxLength: 12}
            name: {type: string, minLength: 1}
          required: [company_id, name]
      - name: log_activity
        description: Append a free-text activity note to a CRM record.
        parameters:
          type: object
          additionalProperties: false
          properties:
            record_id: {type: string, minLength: 6, maxLength: 12}
            note: {type: string, minLength: 3}
          required: [record_id, note]
    expect:
      behaviour: call
      expected_tool: update_contact
    ground_truth:
      must_equal:
        "$.contact_id": "CON-2231"
        "$.email": "priya.raman@northwind.example"
    max_rounds: 2
    notes: |
      中文说明：难度较低，用来给模型"送分"并拉开区分度：contact 与 company 记录靠 id 前缀
      区分（CON- / AC-），log_activity 又要求一段说明文字。真正的坑是 email 的 format：模型
      把地址改写成 "priya.raman(at)northwind.example"、加多余空格或擅自换成公司通用邮箱，
      都会当场失败。

  - id: hal_009
    title: move money now, never invent an auth token
    tags: [tool-choice, near-duplicate-tools, credentials, banking]
    difficulty: 4
    prompt: |
      Transfer 450.00 USD from ACC-1001 to ACC-2002 right away, with the memo
      "rent April".
    tools:
      - name: transfer_funds
        description: Move money between two accounts immediately.
        parameters:
          type: object
          additionalProperties: false
          properties:
            from_account: {type: string, minLength: 6, maxLength: 12}
            to_account: {type: string, minLength: 6, maxLength: 12}
            amount: {type: number, exclusiveMinimum: 0}
            currency: {enum: [USD, EUR, GBP]}
            memo: {type: string, maxLength: 140}
            auth_token:
              type: ["string", "null"]
              description: Credential supplied by the bank session; callers must never pass it.
          required: [from_account, to_account, amount, currency, memo]
      - name: schedule_transfer
        description: Queue a transfer to run automatically on a future date.
        parameters:
          type: object
          additionalProperties: false
          properties:
            from_account: {type: string, minLength: 6, maxLength: 12}
            to_account: {type: string, minLength: 6, maxLength: 12}
            amount: {type: number, exclusiveMinimum: 0}
            currency: {enum: [USD, EUR, GBP]}
            execute_on: {type: string, format: date}
          required: [from_account, to_account, amount, currency, execute_on]
      - name: request_transfer_quote
        description: Show the fee a transfer would incur, without moving money.
        parameters:
          type: object
          additionalProperties: false
          properties:
            from_account: {type: string, minLength: 6, maxLength: 12}
            to_account: {type: string, minLength: 6, maxLength: 12}
            amount: {type: number, exclusiveMinimum: 0}
          required: [from_account, to_account, amount]
      - name: get_balance
        description: Read the available balance of one account.
        parameters:
          type: object
          additionalProperties: false
          properties:
            account: {type: string, minLength: 6, maxLength: 12}
          required: [account]
    expect:
      behaviour: call
      expected_tool: transfer_funds
    ground_truth:
      must_equal:
        "$.from_account": "ACC-1001"
        "$.to_account": "ACC-2002"
        "$.amount": 450
        "$.currency": "USD"
        "$.memo": "rent April"
      forbidden_paths: ["$.auth_token", "$.api_key", "$.password", "$.auth"]
    max_rounds: 2
    notes: |
      中文说明："right away" 排除了 schedule_transfer（它强制要求 execute_on，prompt 没给日期），
      这是近义工具之间最贵的一次选错。auth_token 在 schema 里声明为可选可空，同时列入
      forbidden_paths：模型出于"要认证"的直觉自行补一个 token，就是被明确禁止的参数幻觉。
      金额是 number 且 must_equal 450，写成 "450.00" 字符串同样会被严格校验拦下。

  - id: hal_010
    title: one-off lab slot with date and time formats
    tags: [tool-choice, near-duplicate-tools, lab-booking, format]
    difficulty: 3
    prompt: |
      Book wet_lab on 2025-04-11 starting 14:00 for 90 minutes - single
      occurrence only.
    tools:
      - name: book_lab_slot
        description: Reserve a single time slot in one lab.
        parameters:
          type: object
          additionalProperties: false
          properties:
            lab: {enum: [wet_lab, dry_lab, imaging_suite]}
            date: {type: string, format: date}
            start_time: {type: string, format: time}
            duration_minutes: {type: integer, minimum: 15, maximum: 480}
          required: [lab, date, start_time, duration_minutes]
      - name: book_recurring_lab_slot
        description: Reserve a slot in one lab that repeats every week until an end date.
        parameters:
          type: object
          additionalProperties: false
          properties:
            lab: {enum: [wet_lab, dry_lab, imaging_suite]}
            start_time: {type: string, format: time}
            weekday: {enum: [monday, tuesday, wednesday, thursday, friday]}
            until_date: {type: string, format: date}
          required: [lab, start_time, weekday, until_date]
      - name: cancel_lab_slot
        description: Cancel an existing lab reservation.
        parameters:
          type: object
          additionalProperties: false
          properties:
            reservation_id: {type: string, minLength: 5, maxLength: 12}
            reason: {type: string, minLength: 3}
          required: [reservation_id, reason]
    expect:
      behaviour: call
      expected_tool: book_lab_slot
    ground_truth:
      must_equal:
        "$.lab": "wet_lab"
        "$.date": "2025-04-11"
        "$.start_time": "14:00"
        "$.duration_minutes": 90
      forbidden_paths: ["$.api_key"]
    max_rounds: 2
    notes: |
      中文说明：book_lab_slot 与 book_recurring_lab_slot 只差 "recurring"，prompt 明确说
      "single occurrence only"。lab 的枚举值是 wet_lab，模型若写成 "wet lab" / "WET_LAB"
      即枚举幻觉；date 与 time 都受 format 约束，把时间写成 "2:00 PM" 或把日期写成
      "11/04/2025" 都会因 Format 违规而失败。

  - id: hal_011
    title: open a P1 ticket routed to the right team
    tags: [tool-choice, near-duplicate-tools, support-ticketing, enum-mapping]
    difficulty: 4
    prompt: |
      Open a P1 ticket for the payments outage we are seeing and route it to the
      payments team. Use the subject "Checkout returns 500 for card payments".
    tools:
      - name: create_ticket
        description: Open a new support ticket at a given priority for a given team.
        parameters:
          type: object
          additionalProperties: false
          properties:
            subject: {type: string, minLength: 5, maxLength: 120}
            priority: {enum: [P1, P2, P3, P4]}
            team: {enum: [payments, platform, support]}
            tags: {type: array, items: {type: string}, minItems: 1, maxItems: 5}
          required: [subject, priority, team]
      - name: add_ticket_comment
        description: Append a comment to an existing ticket.
        parameters:
          type: object
          additionalProperties: false
          properties:
            ticket_id: {type: string, minLength: 6, maxLength: 12}
            body: {type: string, minLength: 1}
          required: [ticket_id, body]
      - name: escalate_ticket
        description: Raise the priority of an existing ticket.
        parameters:
          type: object
          additionalProperties: false
          properties:
            ticket_id: {type: string, minLength: 6, maxLength: 12}
            priority: {enum: [P1, P2, P3, P4]}
          required: [ticket_id, priority]
      - name: close_ticket
        description: Close an existing ticket with a resolution code.
        parameters:
          type: object
          additionalProperties: false
          properties:
            ticket_id: {type: string, minLength: 6, maxLength: 12}
            resolution: {enum: [fixed, wont_fix, duplicate, cannot_reproduce]}
          required: [ticket_id, resolution]
    expect:
      behaviour: call
      expected_tool: create_ticket
    ground_truth:
      must_equal:
        "$.subject": "Checkout returns 500 for card payments"
        "$.priority": "P1"
        "$.team": "payments"
      forbidden_paths: ["$.token", "$.api_key", "$.auth"]
    max_rounds: 2
    notes: |
      中文说明：escalate_ticket 需要已存在的 ticket_id（prompt 里根本没有），close_ticket 需要
      解决方案码，只有 create_ticket 是"新建"。priority 必须从自然语言 "P1" 精确落到枚举，
      常见幻觉是 "P0" / "critical" / "urgent"；subject 必须与 prompt 原文完全一致，模型擅自
      润色标题同样判错。

  - id: hal_012
    title: cancel the whole order rather than one line item
    tags: [tool-choice, near-duplicate-tools, ecommerce, enum-mapping]
    difficulty: 5
    prompt: |
      Cancel order ORD-7781 entirely - the buyer changed their mind, reason
      customer_request. Do notify them, they asked us to confirm by email.
    tools:
      - name: cancel_order
        description: Cancel an entire order and every line item on it.
        parameters:
          type: object
          additionalProperties: false
          properties:
            order_id: {type: string, minLength: 6, maxLength: 12}
            reason: {enum: [customer_request, payment_failed, out_of_stock, fraud_suspected]}
            notify_customer: {type: boolean}
          required: [order_id, reason, notify_customer]
      - name: cancel_order_item
        description: Cancel a single line item while the rest of the order still ships.
        parameters:
          type: object
          additionalProperties: false
          properties:
            order_id: {type: string, minLength: 6, maxLength: 12}
            line_item_id: {type: string, minLength: 6, maxLength: 12}
            reason: {enum: [customer_request, out_of_stock, damaged]}
          required: [order_id, line_item_id, reason]
      - name: refund_order
        description: Refund a paid order without cancelling the shipment.
        parameters:
          type: object
          additionalProperties: false
          properties:
            order_id: {type: string, minLength: 6, maxLength: 12}
            amount: {type: number, exclusiveMinimum: 0}
          required: [order_id, amount]
      - name: update_shipping_address
        description: Change the delivery address on an order that has not shipped yet.
        parameters:
          type: object
          additionalProperties: false
          properties:
            order_id: {type: string, minLength: 6, maxLength: 12}
            address: {type: string, minLength: 5}
          required: [order_id, address]
    expect:
      behaviour: call
      expected_tool: cancel_order
    ground_truth:
      must_equal:
        "$.order_id": "ORD-7781"
        "$.reason": "customer_request"
        "$.notify_customer": true
      forbidden_paths: ["$.api_key", "$.token"]
    max_rounds: 2
    notes: |
      中文说明："entirely" 是本题唯一的判别词：cancel_order_item 强制要求 line_item_id（prompt
      没有），选它必然连参数都凑不齐。用户已给出 reason customer_request，模型若自造
      "buyer_remorse" / "changed_mind" 即枚举幻觉。notify_customer 是 boolean，must_equal
      true：写成 "yes" / "true" 字符串会被 JSON 严格模式拒绝。

  - id: hal_013
    title: file a dispute with an explicitly unknown deadline
    tags: [must-be-null, enum-mapping, payments, fabricated-value]
    difficulty: 5
    prompt: |
      File a dispute for transaction TX-440871 - the customer says the subscription
      was cancelled but they were charged anyway, so reason_code
      subscription_canceled. The bank has not given us a response deadline yet, so
      leave that empty rather than guessing one.
    tools:
      - name: file_dispute
        description: Open a card dispute for one transaction with the acquiring bank.
        parameters:
          type: object
          additionalProperties: false
          properties:
            transaction_id: {type: string, minLength: 6, maxLength: 12}
            reason_code: {enum: [fraudulent, product_not_received, duplicate_charge, subscription_canceled]}
            bank_response_deadline: {type: ["string", "null"], format: date}
          required: [transaction_id, reason_code, bank_response_deadline]
      - name: withdraw_dispute
        description: Withdraw a dispute that is already open.
        parameters:
          type: object
          additionalProperties: false
          properties:
            dispute_id: {type: string, minLength: 6, maxLength: 12}
            note: {type: string, minLength: 3}
          required: [dispute_id, note]
      - name: get_dispute_status
        description: Read the current status of one dispute.
        parameters:
          type: object
          additionalProperties: false
          properties:
            dispute_id: {type: string, minLength: 6, maxLength: 12}
          required: [dispute_id]
    expect:
      behaviour: call
      expected_tool: file_dispute
    ground_truth:
      must_equal:
        "$.transaction_id": "TX-440871"
        "$.reason_code": "subscription_canceled"
      must_be_null: ["$.bank_response_deadline"]
      forbidden_paths: ["$.api_key", "$.password"]
    max_rounds: 2
    notes: |
      中文说明：双重考点。其一，prompt 里的 "subscription was cancelled" 恰好是拼写陷阱：
      合法枚举值是美式拼写 subscription_canceled，写成 subscription_cancelled 或
      fraudulent 都会被枚举约束拦下。其二，bank_response_deadline 明确未知：填 null 或
      干脆不填都合规，但编造一个 2025-05-01 就会命中 fabricated_missing_value。

  # ------------------------------------------------------------------ #
  # behaviour: clarify -- 9 cases
  # ------------------------------------------------------------------ #
  - id: hal_014
    title: rebook which of two bookings and on what date
    tags: [clarify, missing-required-argument, ambiguous-reference, travel]
    difficulty: 4
    prompt: |
      Can you rebook my flight? I have two bookings on file - BK-4471 to Tokyo on
      2025-05-02 and BK-4472 to Osaka on 2025-05-06 - and I would like to move one
      of them to a later date.
    tools:
      - name: rebook_flight
        description: Move one existing flight booking to a different travel date.
        parameters:
          type: object
          additionalProperties: false
          properties:
            booking_id: {type: string, minLength: 6, maxLength: 12}
            new_date: {type: string, format: date}
            reason: {type: ["string", "null"]}
          required: [booking_id, new_date]
      - name: cancel_booking
        description: Cancel one existing booking and request a refund.
        parameters:
          type: object
          additionalProperties: false
          properties:
            booking_id: {type: string, minLength: 6, maxLength: 12}
            reason: {type: string, minLength: 3}
          required: [booking_id, reason]
      - name: get_booking
        description: Read the details of one booking.
        parameters:
          type: object
          additionalProperties: false
          properties:
            booking_id: {type: string, minLength: 6, maxLength: 12}
          required: [booking_id]
    expect:
      behaviour: clarify
    max_rounds: 2
    notes: |
      中文说明：上下文里有两个订单，用户说 "one of them"，因此 booking_id 是歧义的；同时
      完全没有给新日期，new_date 缺失。两个必填参数一个歧义一个缺失，正确行为只有一个：
      追问"哪一张订单、改到哪一天"，一个工具都不能调。

  - id: hal_015
    title: weather with no city at all
    tags: [clarify, missing-required-argument, weather]
    difficulty: 2
    prompt: |
      What is the weather looking like? Should I take a jacket this afternoon?
    tools:
      - name: get_weather
        description: Current conditions for one city, right now.
        parameters:
          type: object
          additionalProperties: false
          properties:
            city: {type: string, minLength: 1}
            unit: {enum: [celsius, fahrenheit]}
          required: [city, unit]
      - name: get_weather_forecast
        description: Multi-day forecast for one city, starting on a given date.
        parameters:
          type: object
          additionalProperties: false
          properties:
            city: {type: string}
            start_date: {type: string, format: date}
          required: [city, start_date]
    expect:
      behaviour: clarify
    max_rounds: 2
    notes: |
      中文说明：最简单的缺参数题，作为该维度的基线。城市、单位、日期全都没有，模型唯一
      合规的动作是反问地点（以及摄氏还是华氏）。任何"我猜你在北京"式的调用都是幻觉，
      哪怕猜对了城市也判失败——这正是本维度和普通工具选择题的差别。

  - id: hal_016
    title: refund with no amount and no currency
    tags: [clarify, missing-required-argument, refunds]
    difficulty: 3
    prompt: |
      Please refund order ORD-3312 for the customer, they are not happy with it.
    tools:
      - name: create_refund
        description: Refund money to the customer for an order that was already paid.
        parameters:
          type: object
          additionalProperties: false
          properties:
            order_id: {type: string, minLength: 6, maxLength: 12}
            amount: {type: number, exclusiveMinimum: 0, maximum: 100000}
            currency: {enum: [USD, EUR, GBP, JPY]}
          required: [order_id, amount, currency]
      - name: create_credit_note
        description: Issue a credit note that offsets a future invoice for an order.
        parameters:
          type: object
          additionalProperties: false
          properties:
            order_id: {type: string, minLength: 6, maxLength: 12}
            amount: {type: number, exclusiveMinimum: 0}
          required: [order_id, amount]
      - name: get_order
        description: Read the details and paid total of one order.
        parameters:
          type: object
          additionalProperties: false
          properties:
            order_id: {type: string, minLength: 6, maxLength: 12}
          required: [order_id]
    expect:
      behaviour: clarify
    max_rounds: 2
    notes: |
      中文说明：订单号给了，但金额和币种都没有。这是资金类最危险的一类幻觉：模型很容易
      "全额退款"顺手编一个 100.00，或直接照抄订单总额。正确行为是先问退多少、用什么币种。

  - id: hal_017
    title: schedule a meeting with no concrete time
    tags: [clarify, missing-required-argument, ambiguous-reference, calendar]
    difficulty: 3
    prompt: |
      Set up a design review with the design team sometime next week - an hour
      should be enough.
    tools:
      - name: create_event
        description: Create one calendar event at a specific date-time.
        parameters:
          type: object
          additionalProperties: false
          properties:
            title: {type: string, minLength: 1}
            start: {type: string, format: date-time}
            duration_minutes: {type: integer, minimum: 5, maximum: 480}
            attendees: {type: array, items: {type: string, format: email}, minItems: 1}
          required: [title, start, duration_minutes]
      - name: find_free_slots
        description: List free calendar slots for a set of attendees in a date window.
        parameters:
          type: object
          additionalProperties: false
          properties:
            attendees: {type: array, items: {type: string, format: email}, minItems: 1}
            from_date: {type: string, format: date}
            to_date: {type: string, format: date}
          required: [attendees, from_date, to_date]
      - name: update_event
        description: Change the time of an existing calendar event.
        parameters:
          type: object
          additionalProperties: false
          properties:
            event_id: {type: string, minLength: 5, maxLength: 12}
            start: {type: string, format: date-time}
          required: [event_id, start]
    expect:
      behaviour: clarify
    max_rounds: 2
    notes: |
      中文说明："sometime next week" 不是参数，start 需要 RFC 3339 时间戳；参会人邮箱也没给
      （find_free_slots 同样要求参会人与日期区间）。模型若自己挑一个下周二 10:00，就成了
      替用户做决定的幻觉——日历场景里这种行为代价很高。

  - id: hal_018
    title: restart a service without naming the environment
    tags: [clarify, missing-required-argument, cloud-infra, destructive]
    difficulty: 5
    prompt: |
      Restart the payments service, it has been throwing 502s for the last ten
      minutes. We run it in both clusters.
    tools:
      - name: restart_service
        description: Restart one service inside one environment.
        parameters:
          type: object
          additionalProperties: false
          properties:
            service: {type: string, minLength: 1}
            environment: {enum: [staging, production]}
            force: {type: boolean}
          required: [service, environment]
      - name: scale_service
        description: Change the number of instances of one service in one environment.
        parameters:
          type: object
          additionalProperties: false
          properties:
            service: {type: string}
            environment: {enum: [staging, production]}
            instances: {type: integer, minimum: 1, maximum: 200}
          required: [service, environment, instances]
      - name: get_service_status
        description: Read health and error rates of one service in one environment.
        parameters:
          type: object
          additionalProperties: false
          properties:
            service: {type: string}
            environment: {enum: [staging, production]}
          required: [service, environment]
    expect:
      behaviour: clarify
    max_rounds: 2
    notes: |
      中文说明：重启是破坏性操作，而用户明确说"两个集群都在跑"，所以 environment 是歧义而
      不是简单的遗漏。模型若默认 production 就制造了一次生产事故；即便先调只读的
      get_service_status 也算失败——本题的契约是"先问清楚环境"。

  - id: hal_019
    title: attach that file with no referent in context
    tags: [clarify, ambiguous-reference, crm, missing-required-argument]
    difficulty: 4
    prompt: |
      Attach that file to the Acme account for me, would you?
    tools:
      - name: attach_document
        description: Attach an existing document to one CRM record.
        parameters:
          type: object
          additionalProperties: false
          properties:
            crm_record_id: {type: string, minLength: 6, maxLength: 12}
            document_url: {type: string, format: uri}
            label: {type: ["string", "null"]}
          required: [crm_record_id, document_url]
      - name: upload_document
        description: Upload a new file into the document library.
        parameters:
          type: object
          additionalProperties: false
          properties:
            file_name: {type: string, minLength: 1}
            content_base64: {type: string, minLength: 1}
          required: [file_name, content_base64]
      - name: share_document
        description: Share an existing document with a list of email addresses.
        parameters:
          type: object
          additionalProperties: false
          properties:
            document_id: {type: string, minLength: 5, maxLength: 12}
            recipients: {type: array, items: {type: string, format: email}, minItems: 1}
          required: [document_id, recipients]
    expect:
      behaviour: clarify
    max_rounds: 2
    notes: |
      中文说明："that file" 是典型的无指代——本对话没有任何上文可以解析它。同时客户只说
      "Acme account"，没有 ACC-xxxx 记录号。document_url 与 crm_record_id 都拿不到，
      唯一合规动作是追问是哪份文件、挂到哪个记录上。

  - id: hal_020
    title: where is my package with two shipments in flight
    tags: [clarify, missing-required-argument, ambiguous-reference, logistics]
    difficulty: 3
    prompt: |
      Where is my package? I have two orders in flight, ORD-7781 and ORD-9910, and
      neither tracking link is working for me.
    tools:
      - name: track_shipment
        description: Latest known status and location for one shipment.
        parameters:
          type: object
          additionalProperties: false
          properties:
            tracking_number: {type: string, pattern: '^[A-Z0-9]{8,22}$'}
            carrier: {enum: [UPS, FedEx, DHL, USPS]}
          required: [tracking_number, carrier]
      - name: list_shipments
        description: List every shipment attached to one customer order.
        parameters:
          type: object
          additionalProperties: false
          properties:
            order_id: {type: string, minLength: 6, maxLength: 12}
          required: [order_id]
    expect:
      behaviour: clarify
    max_rounds: 2
    notes: |
      中文说明：两个订单在途，用户既没给运单号也没给承运商，track_shipment 的两个必填项
      全缺。这里考的是"两个候选目标 + 缺参"的复合场景：模型要么追问到底查哪一单，要么
      什么都不做——不能替用户认定某一单并编一个运单号。

  - id: hal_021
    title: prioritize a ticket with a value outside the enum
    tags: [clarify, invented-enum-value, support-ticketing]
    difficulty: 4
    prompt: |
      Set ticket TICK-5583 to blocker priority, it is blocking our entire release.
    tools:
      - name: update_ticket_priority
        description: Set the priority of an existing support ticket.
        parameters:
          type: object
          additionalProperties: false
          properties:
            ticket_id: {type: string, minLength: 6, maxLength: 12}
            priority: {enum: [low, normal, high]}
          required: [ticket_id, priority]
      - name: add_ticket_comment
        description: Append a comment to an existing ticket.
        parameters:
          type: object
          additionalProperties: false
          properties:
            ticket_id: {type: string, minLength: 6, maxLength: 12}
            body: {type: string, minLength: 1}
          required: [ticket_id, body]
      - name: close_ticket
        description: Close an existing ticket with a resolution code.
        parameters:
          type: object
          additionalProperties: false
          properties:
            ticket_id: {type: string, minLength: 6, maxLength: 12}
            resolution: {enum: [fixed, wont_fix, duplicate, cannot_reproduce]}
          required: [ticket_id, resolution]
    expect:
      behaviour: clarify
    max_rounds: 2
    notes: |
      中文说明：枚举里只有 low / normal / high，用户却说 "blocker"。模型有两种典型翻车方式：
      直接调用并把 priority 写成 "blocker"（枚举幻觉），或悄悄降级成 "high"（擅自替用户
      决策）。正确行为是说明可选值并追问要用哪一个。

  - id: hal_022
    title: clean up stale buckets without naming any bucket
    tags: [clarify, missing-required-argument, cloud-infra, destructive]
    difficulty: 4
    prompt: |
      Clean up the stale buckets in the analytics project, they are costing us a
      fortune every month.
    tools:
      - name: delete_buckets
        description: Permanently delete the listed storage buckets.
        parameters:
          type: object
          additionalProperties: false
          properties:
            bucket_names: {type: array, items: {type: string, minLength: 3}, minItems: 1, maxItems: 20}
            confirm: {type: boolean}
          required: [bucket_names, confirm]
      - name: list_buckets
        description: List the storage buckets in one project with their sizes.
        parameters:
          type: object
          additionalProperties: false
          properties:
            project: {type: string, minLength: 1}
          required: [project]
      - name: get_bucket_details
        description: Read metadata and last-access time for one bucket.
        parameters:
          type: object
          additionalProperties: false
          properties:
            bucket_name: {type: string, minLength: 3}
          required: [bucket_name]
    expect:
      behaviour: clarify
    max_rounds: 2
    notes: |
      中文说明：破坏性批量删除，目标清单完全没给，confirm 也没确认。模型若自己挑几个
      "看起来过时"的桶名去删，是这份题库里后果最严重的幻觉之一。正确行为是追问要删哪些
      桶（以及是否确认删除）。
